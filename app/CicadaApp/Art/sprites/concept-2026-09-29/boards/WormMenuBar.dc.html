<style>
body{margin:0;background:#0b0b0c;-webkit-font-smoothing:antialiased;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif}
.t-dark{--rail:#0C0D0E;--base:#111213;--pane:#141517;--hover:#1B1C1E;--focus:#18191B;--option:#1D1E21;--button:#232427;--selected:#222326;--menu:#1B1C1E;--key:#26272A;--badge:#3A3B3F;--t1:#F5F5F6;--t2:#D0D1D4;--t3:#8D8F94;--t4:#6A6C71;--accentText:#0A84FF;--primary:#0A84FF;--ring:rgba(255,255,255,.07);--ringStrong:rgba(255,255,255,.12);--floatRing:rgba(255,255,255,.10);--floatShadow:0 0 0 0 transparent;--warning:#F59E0B;--markInvert:none;--focusRing:rgba(10,132,255,.9)}
.t-light{--rail:#EFEFEC;--base:#F7F7F5;--pane:#FBFBFA;--hover:#EFEFEC;--focus:#FFFFFF;--option:#F7F7F5;--button:#F2F2F0;--selected:#E8E8E5;--menu:#FFFFFF;--key:#EAEAE7;--badge:#D9D9D6;--t1:#141415;--t2:#38393C;--t3:#6A6B70;--t4:#8A8B90;--accentText:#0062CC;--primary:#007AFF;--ring:rgba(0,0,0,.07);--ringStrong:rgba(0,0,0,.12);--floatRing:rgba(0,0,0,.08);--floatShadow:0 12px 32px rgba(0,0,0,.14);--warning:#B45309;--markInvert:invert(1);--focusRing:rgba(0,122,255,.9)}
.surf{background:var(--base);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;font-size:13px;line-height:1.35}
.surf *{box-sizing:border-box}
.card{background:var(--focus);border-radius:14px;box-shadow:inset 0 0 0 1px var(--ring)}
.tile{background:var(--focus);border-radius:10px;box-shadow:inset 0 0 0 1px var(--ring)}
.btnp{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 18px;border:0;border-radius:9px;background:var(--primary);color:#FFFFFF;font:600 14px -apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif}
.btnn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:0;border-radius:8px;background:var(--button);box-shadow:inset 0 0 0 1px var(--ringStrong);color:var(--t1);font:500 13px -apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif}
.btns{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:0;border-radius:7px;background:var(--button);box-shadow:inset 0 0 0 1px var(--ringStrong);color:var(--t1);font:500 12px -apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif}
.btnq{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:var(--t2);font:500 12px -apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif}
.link{border:0;background:none;padding:0;color:var(--accentText);font:500 13px -apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;cursor:pointer}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:4px 6px;border-radius:6px;color:var(--t2);font:500 13px -apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif}
.lbl{font-size:11px;font-weight:500;color:var(--t3)}
.meta{font-size:12px;color:var(--t3)}
.body{font-size:13px;color:var(--t2)}
.sentence{font:600 30px 'SF Pro Display',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;letter-spacing:-0.4px;color:var(--t1)}
.tail{font-size:18px;font-style:italic;color:var(--t2)}
.whisper{font-size:12px;color:var(--t3)}
.plate{position:absolute;display:flex;align-items:center;gap:3px;padding-left:4px;box-sizing:border-box;font:600 11px -apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;color:#F5EBD3;letter-spacing:0;white-space:nowrap}
.mk{display:block;flex:none}
.pop{position:absolute;background:var(--menu);border-radius:12px;box-shadow:inset 0 0 0 1px var(--floatRing),var(--floatShadow);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;font-size:13px}
.row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t1)}
.row .m{font-size:12px;color:var(--t3);white-space:nowrap}
.row .s{font-size:12px;color:var(--t2);white-space:nowrap;text-align:right}
.tabs{display:flex;gap:4px;align-items:center}
.tab{border:0;background:none;padding:5px 9px;border-radius:7px;font:500 13px -apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;color:var(--t3);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--selected);color:var(--t1)}
.menu{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:0;border-radius:7px;background:var(--button);box-shadow:inset 0 0 0 1px var(--ringStrong);font:500 12px -apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;color:var(--t1)}
.field{height:28px;width:180px;border:0;border-radius:7px;background:var(--option);box-shadow:inset 0 0 0 1px var(--ringStrong);color:var(--t1);font:12px -apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;padding:0 10px 0 28px}
.field::placeholder{color:var(--t3)}
.kbd{font:500 11px ui-monospace,Menlo,monospace;color:var(--t3);background:var(--key);border-radius:4px;padding:1px 5px}
.px{image-rendering:pixelated}
.cap{font-size:12px;color:var(--t3);text-align:center}

</style>
