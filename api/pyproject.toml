[project]
name = "cicada-api"
version = "0.6.0"
description = "Cicada companion app backend — filesystem-backed API for the personal knowledge graph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10",
    "beautifulsoup4>=4.14.3",
    # EmbeddingGemma 2 on the Neural Engine (api/services/coreml_embedder.py; macOS 15+, owner 2026-10-09).
    "coremltools>=9.0; sys_platform == 'darwin'",
    "fastapi>=0.135.3",
    "icalendar>=6.0",
    "litellm>=1.83.4",
    "loguru>=0.7.3",
    "mcp>=2.2,<3",
    "onnxruntime>=1.23.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pypdfium2>=4.30",
    "python-multipart>=0.0.24",
    "pyyaml>=6.0.3",
    # A site's SVG icon, sanitised then drawn to a PNG in a locked-down child (api/services/svg_raster.py, 2026-10-20).
    "resvg-py>=0.5.0",
    "sentence-transformers>=5.0.0",
    "sqlite-vec>=0.1.9",
    "thefuzz[speedup]>=0.22.1",
    "tokenizers>=0.22.2",
    "tqdm>=4.66.0",
    "uvicorn[standard]>=0.44.0",
]

[project.optional-dependencies]
# On-device embedding fallback (CICADA_EMBEDDING_MODE=local). Pulls torch:
# ~250MB install; the all-MiniLM-L6-v2 model (~90MB) is downloaded on first
# index build. Not a hard dependency — only OpenAI users who want offline
# embeddings need it. Install with: uv sync --extra local --directory api
local = ["sentence-transformers>=2.2"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]

[tool.pytest.ini_options]
# The test tiers (docs/goals/working-method.md): the default run leaves out the wall-clock budgets (`bench`), which
# flake on a busy Mac. `make test-bench` runs them alone; `make test` (before a release) clears this and runs them too.
# A later `-m` replaces this one, so `-m crucial` and `-m bench` select exactly their marker.
addopts = "-m 'not bench'"
markers = [
    "crucial: guards a CLAUDE.md rail; the daily tier (`make test-crucial`, listed in crucial.txt)",
    "bench: a wall-clock budget or a benchmark run; `make test-bench` and `make test`, never the default run",
    "shipped_engine_default: a bare Settings() keeps the shipped llm_mode (auto) instead of the suite's key",
]
