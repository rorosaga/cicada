# The backend's crucial tier (docs/goals/working-method.md, "Test tiers") on every push to dev and every PR into it,
# so a background agent's PR shows red before the coordinator reviews it. The same command as `make
# test-crucial-backend`: `api/tests/crucial.txt` names the tests that guard CLAUDE.md's rails. On a PR, the app's
# Swift lint tests run too, on a hosted macOS runner (`swift-lint`); the rest of the Swift tier needs the owner's Mac.
# Cost: the repo is public, so standard GitHub-hosted runners, macOS included, are free.
name: Dev CI

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

permissions:
  contents: read

concurrency:
  # A newer push to a PR supersedes its older run. A push to dev groups by commit, so no dev commit's run is cancelled
  # or dropped as a superseded pending run: each keeps its own result.
  group: dev-ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  crucial-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          python-version: "3.12.11"

      - name: The backend's venv, from the lock
        run: cd api && uv sync --frozen

      - name: The crucial tier
        run: make test-crucial-backend

  # The rest of the backend suite, split so no shard takes long. A push to dev runs every test file, so a bad merge shows
  # on dev within minutes. A PR runs only the files naming what it changed (api/tests/_ci_select.py), and a shard with
  # nothing to do stops before the venv. fetch-depth 2 is what a PR's diff needs: its merge ref's first parent is the base.
  backend-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: This shard's files
        id: select
        run: |
          # MEASURING: every file on a PR too, until this branch has its numbers.
          python3 api/tests/_ci_select.py --shard ${{ matrix.shard }}/6 --all > "$RUNNER_TEMP/files"
          wc -l < "$RUNNER_TEMP/files"
          echo "count=$(wc -l < "$RUNNER_TEMP/files")" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        if: steps.select.outputs.count != '0'
        with:
          python-version: "3.12.11"

      - name: The backend's venv, from the lock
        if: steps.select.outputs.count != '0'
        run: cd api && uv sync --frozen

      - name: The shard's tests
        if: steps.select.outputs.count != '0'
        run: xargs api/.venv/bin/python -m pytest -q -p no:cacheprovider --tb=short < "$RUNNER_TEMP/files"

  # The app's lint tier: static checks over the Swift sources (design rules, motion, copy, provenance ids), which #517
  # merged past when only the backend ran here. `swift test --filter Lint` builds the package and runs only the
  # `*Lint*` test classes: no signing, no app bundle, no window. The macOS 26 image is the one the release build uses
  # (the app needs its SDK). SwiftPM's `.build` is cached on the package's sources, so a PR rebuilds only what moved.
  swift-lint:
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: SwiftPM build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/CicadaApp/.build
          key: swift-lint-${{ runner.os }}-${{ hashFiles('app/CicadaApp/Package.swift', 'app/CicadaApp/Sources/**', 'app/CicadaApp/Tests/**') }}
          restore-keys: swift-lint-${{ runner.os }}-

      - name: The lint tests
        run: cd app/CicadaApp && swift test --filter Lint
