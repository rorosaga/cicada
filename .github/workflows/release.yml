# G182 — a merge to main is a release (TODO ruling 19).
#
# A push to `main` (the merge of a dev → main release PR) publishes `VERSION`: the plan job checks every version
# stamp agrees and reads the remote's v* tags — already tagged: nothing to publish, the run is green; not greater
# than the latest tag: the run fails. Otherwise the build job builds the app with its backend, signs it ad hoc
# inside out, smoke-tests it in a temp folder, zips it and signs the zip with Ed25519, and the publish job
# (scripts/release/publish.sh) judges the version again against the live tags, drafts the GitHub Release at the
# merged commit, checks every asset, and only then publishes it — which is when GitHub creates the tag. Nobody tags by hand, and a failed run advertises nothing.
#
# A push to `ci/release-dry-run`, or a manual run from any branch but main, does everything except publish and
# uploads the result as an artifact. A manual run on main re-attempts publishing an untagged VERSION — the
# recovery path after a failed run.
name: Release

on:
  push:
    branches: ["main", "ci/release-dry-run"]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time on main; a running release is never cancelled. GitHub does cancel a *pending* run when a newer
# one joins its group — harmless on main, where the newer run carries the same or a newer VERSION — so dry runs queue
# in their own group and can never cancel a release waiting its turn.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'release' || format('release-dry-run-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Every version stamp agrees
        run: python3 scripts/release/check_version.py agree

      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          on_main=false
          [ "$GITHUB_REF" = "refs/heads/main" ] && on_main=true
          git ls-remote --tags --refs origin 'refs/tags/v*' > "$RUNNER_TEMP/tags.txt"
          if $on_main; then
            python3 scripts/release/check_version.py plan < "$RUNNER_TEMP/tags.txt" > "$RUNNER_TEMP/plan.txt"
          else
            python3 scripts/release/check_version.py plan --dry-run < "$RUNNER_TEMP/tags.txt" > "$RUNNER_TEMP/plan.txt"
          fi
          cat "$RUNNER_TEMP/plan.txt" >> "$GITHUB_OUTPUT"
          version="$(sed -n 's/^version=//p' "$RUNNER_TEMP/plan.txt")"
          status="$(sed -n 's/^status=//p' "$RUNNER_TEMP/plan.txt")"
          if $on_main && [ "$status" = "released" ]; then
            echo "v$version is already released — nothing to publish."
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif $on_main; then
            echo "Releasing v$version."
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Dry run of $version ($status): builds and signs, publishes nothing."
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-26   # arm64, with Xcode 26 (the app uses the macOS 26 SDK)
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.v.outputs.artifact }}
    env:
      REPO_URL: https://github.com/${{ github.repository }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the build number is the commit count

      - uses: astral-sh/setup-uv@v6

      - name: Version
        id: v
        run: |
          set -euo pipefail
          [ "$(tr -d '[:space:]' < VERSION)" = "$VERSION" ] || { echo "VERSION changed since the plan"; exit 1; }
          build="$(git rev-list --count HEAD)"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "artifact=Cicada-$VERSION-build$build" >> "$GITHUB_OUTPUT"
          echo "Cicada $VERSION (build $build)"

      - name: Cache build inputs
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/cicada-release
          key: cicada-release-${{ hashFiles('scripts/release/inputs.env') }}

      - name: Build the app with its backend
        env:
          CICADA_BUILD_NUMBER: ${{ steps.v.outputs.build }}
          CICADA_SIGN_IDENTITY: "-"
        run: cd app/CicadaApp && ./bundle.sh --release --with-backend

      - name: The app's version agrees
        run: python3 scripts/release/check_version.py agree --info-plist app/CicadaApp/.build/release/Cicada.app/Contents/Info.plist

      - name: Smoke test in a temp folder
        run: scripts/release/smoke-test.sh "app/CicadaApp/.build/release/Cicada.app" 18000

      - name: Package and sign the update
        env:
          CICADA_UPDATE_SIGNING_KEY: ${{ secrets.CICADA_UPDATE_SIGNING_KEY }}
          BUILD: ${{ steps.v.outputs.build }}
        run: |
          set -euo pipefail
          mkdir -p dist
          zip="dist/Cicada-$VERSION.zip"
          ditto -c -k --keepParent "app/CicadaApp/.build/release/Cicada.app" "$zip"
          sig="$(uv run --no-project --with cryptography python scripts/release/sign_update.py sign "$zip")"
          uv run --no-project --with cryptography python scripts/release/sign_update.py verify "$zip" "$sig"
          printf '%s\n' "$sig" > "$zip.sig"
          python3 scripts/release/latest_json.py --version "$VERSION" --build "$BUILD" --zip "$zip" \
            --signature "$sig" --repo-url "$REPO_URL" > dist/latest.json
          python3 scripts/release/check_version.py agree --latest-json dist/latest.json
          # The same bytes under a name that never changes: .../releases/latest/download/Cicada-macos-arm64.zip.
          cp "$zip" dist/Cicada-macos-arm64.zip
          cat dist/latest.json
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.v.outputs.artifact }}
          path: dist/
          retention-days: 14
          overwrite: true   # "Re-run all jobs" uploads again under the same name

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist/

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/release/publish.sh "${{ needs.plan.outputs.version }}" "$GITHUB_SHA" dist
